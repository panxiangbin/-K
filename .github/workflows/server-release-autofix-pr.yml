name: Restricted guarded server autofix

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-fixes:
    if: >-
      github.actor == 'panxiangbin' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'verify-current-release'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact guarded replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'server/bot-ai.js',
              """  const sourceGroupSize = sameRank ? (groups[cards[0].rank]?.length || cards.length) : cards.length;
          const splitCount = !isBomb && sameRank ? Math.max(0, sourceGroupSize - cards.length) : 0;
          const protectedCardCount = !isBomb
""",
              """  const sourceGroupSize = sameRank ? (groups[cards[0].rank]?.length || cards.length) : cards.length;
          const splitCount = !isBomb && sameRank ? Math.max(0, sourceGroupSize - cards.length) : 0;
          const isCompleteGroup = !isBomb && sameRank && cards.length >= 2 && sourceGroupSize === cards.length;
          const protectedCardCount = !isBomb
""",
          )
          replace_once(
              'server/bot-ai.js',
              """    isBomb,
              splitCount,
              breaksBomb,
""",
              """    isBomb,
              splitCount,
              isCompleteGroup,
              breaksBomb,
""",
          )
          replace_once(
              'server/bot-ai.js',
              """  if (candidate.splitCount > 0) score += 850 + candidate.splitCount * 180;
              if (candidate.breaksBomb) score += 1700 + candidate.protectedCardCount * 1500;
""",
              """  // 完整对子、三张及更多同点牌应比拆散后的零牌更优先。
              if (candidate.isCompleteGroup) score -= Math.min(candidate.cards.length, 7) * 90;
              if (candidate.splitCount > 0) score += 850 + candidate.splitCount * 180;
              if (candidate.breaksBomb) score += 1700 + candidate.protectedCardCount * 1500;
""",
          )

          replace_once(
              'server/bot-ai-bomb-preservation.js',
              """function sortByDamage(a, b) {
            return a.damage.bombsBroken - b.damage.bombsBroken
              || b.damage.preservedBombStrength - a.damage.preservedBombStrength
              || b.damage.preservedBombs - a.damage.preservedBombs
              || a.damage.protectedCardsUsed - b.damage.protectedCardsUsed
              || rankStrength(a.pattern.rank) - rankStrength(b.pattern.rank)
              || a.cards.map(card => card.id).sort().join('|').localeCompare(b.cards.map(card => card.id).sort().join('|'));
          }
""",
              """function sortByDamage(a, b) {
            return a.damage.bombsBroken - b.damage.bombsBroken
              || b.damage.preservedBombs - a.damage.preservedBombs
              || a.damage.protectedCardsUsed - b.damage.protectedCardsUsed
              // 炸弹损伤相同时先用最小合法点数，避免为了保留稍强炸弹而无谓抬高。
              || rankStrength(a.pattern.rank) - rankStrength(b.pattern.rank)
              || b.damage.preservedBombStrength - a.damage.preservedBombStrength
              || a.cards.map(card => card.id).sort().join('|').localeCompare(b.cards.map(card => card.id).sort().join('|'));
          }
""",
          )

          replace_once(
              'server/bot-ai-hand-structure.test.js',
              "{ nextOpponentCards: 3, minOpponentCards: 3 },",
              "{ nextOpponentCards: 3, minOpponentCards: 3, pileScore: 20 },",
          )
          replace_once(
              'server/bot-ai-hand-structure.test.js',
              """  assert.equal(isImmediateThreat({ nextOpponentCards: 3 }), true);
            assert.equal(isImmediateThreat({ nextOpponentCards: 5, minOpponentCards: 2 }), true);
""",
              """  assert.equal(isImmediateThreat({ nextOpponentCards: 3, pileScore: 20 }), true);
            assert.equal(isImmediateThreat({ nextOpponentCards: 3, pileScore: 0 }), false);
            assert.equal(isImmediateThreat({ nextOpponentCards: 5, minOpponentCards: 2, threatSource: 'table', pileScore: 20 }), true);
""",
          )

          replace_once(
              'server/bot-context.js',
              """    const isBotPlay = botPlayerId && play.playerId === botPlayerId;
              if (isBotPlay) continue;
              incrementCount(opponentPlayCounts, play.count);
""",
              """    const isBotPlay = botPlayerId && play.playerId === botPlayerId;
              if (isBotPlay) continue;
              // 旧记录没有玩家归属时只保留全局牌型统计，不能误算成远处对手压力。
              const hasPlayerId = typeof play.playerId === 'string' && play.playerId.length > 0;
              if (!hasPlayerId) continue;
              incrementCount(opponentPlayCounts, play.count);
""",
          )

          replace_once(
              'server/bot-public-bomb-threat.test.js',
              "return [card('小王', 'JOKER'), card('小王', 'JOKER'), card('大王', 'JOKER'), card('大王', 'JOKER')];",
              "return [card('小王', 'joker'), card('小王', 'joker'), card('大王', 'joker'), card('大王', 'joker')];",
          )

          replace_once(
              'server/ws-heartbeat.js',
              """  const interval = setInterval(() => {
""",
              """  const boundSockets = new WeakSet();

            function bindSocket(socket, initialize = false) {
              if (!socket || boundSockets.has(socket)) return;
              boundSockets.add(socket);
              if (initialize || typeof socket.isAlive !== 'boolean') socket.isAlive = true;
              socket.on('pong', () => {
                socket.isAlive = true;
              });
            }

            // 接管已有服务时，现存连接也必须具备pong恢复能力。
            for (const socket of wss.clients || []) bindSocket(socket, false);

            const interval = setInterval(() => {
""",
          )
          replace_once(
              'server/ws-heartbeat.js',
              """  wss.on('connection', socket => {
              socket.isAlive = true;
              socket.on('pong', () => {
                socket.isAlive = true;
              });
            });
""",
              """  wss.on('connection', socket => bindSocket(socket, true));
""",
          )
          PY

      - name: Commit guarded fixes to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/bot-ai.js server/bot-ai-bomb-preservation.js server/bot-ai-hand-structure.test.js server/bot-context.js server/bot-public-bomb-threat.test.js server/ws-heartbeat.js
          git diff --cached --check
          git commit -m "fix(server): unblock verified UI release"
          git push origin HEAD:main
