name: Mobile live audit

on:
  pull_request:
    branches: [main]
    paths: ['client/**', '.github/workflows/mobile-live-audit.yml']

permissions:
  contents: read

jobs:
  audit:
    name: Chromium phone operability
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Build and start local release
        shell: bash
        run: |
          cd client && npm ci --include=dev --no-audit --no-fund && DEPLOY_TARGET=github-pages PAGES_BASE_PATH=/pan/50k/ npm run build && cd ..
          cd server && npm ci --omit=dev --no-audit --no-fund && npm start > "${RUNNER_TEMP}/server.log" 2>&1 & cd ..
          preview_root="${RUNNER_TEMP}/preview"
          mkdir -p "${preview_root}/pan/50k"
          cp -R client/dist/. "${preview_root}/pan/50k/"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "${preview_root}" > "${RUNNER_TEMP}/preview.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3002/healthz >/dev/null && curl -fsS http://127.0.0.1:4173/pan/50k/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Install Chromium
        working-directory: client
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Compare player-card and trick-board enhancers
        working-directory: client
        env:
          MOBILE_AUDIT_URL: http://127.0.0.1:4173/pan/50k
        shell: bash
        run: |
          set +e
          failed=0
          common="game-action-guidance,game-action-guard,game-action-feedback,joker-pair-ui-guard,ui-feedback-governor,lobby-entry-feedback,lobby-action-guidance,waiting-room-experience,waiting-room-request-lifecycle,settlement-experience"
          DIAGNOSTIC_CASE="player-card-only" DISABLE_ENHANCERS="${common},game-trick-board-experience" node solo-entry-diagnostic.mjs
          s=$?; echo "player-card-only:${s}" | tee -a mobile-audit-artifacts/enhancer-outcomes.txt; [ "$s" -ne 0 ] && failed=1
          DIAGNOSTIC_CASE="trick-board-only" DISABLE_ENHANCERS="${common},game-player-card-experience" node solo-entry-diagnostic.mjs
          s=$?; echo "trick-board-only:${s}" | tee -a mobile-audit-artifacts/enhancer-outcomes.txt; [ "$s" -ne 0 ] && failed=1
          exit "$failed"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-enhancer-diagnostics-${{ github.run_attempt }}
          path: client/mobile-audit-artifacts
          if-no-files-found: error
          retention-days: 14
