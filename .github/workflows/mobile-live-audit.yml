name: Mobile live audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/mobile-live-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-live-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Chromium phone operability
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci --include=dev --no-audit --no-fund

      - name: Build nested Pages release
        working-directory: client
        env:
          DEPLOY_TARGET: github-pages
          PAGES_BASE_PATH: /pan/50k/
        run: npm run build

      - name: Install server dependencies
        working-directory: server
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Start local backend and nested static preview
        shell: bash
        run: |
          set -euo pipefail
          preview_root="${RUNNER_TEMP}/henan-50k-preview-root"
          mkdir -p "${preview_root}/pan/50k"
          cp -R client/dist/. "${preview_root}/pan/50k/"
          (cd server && npm start > "${RUNNER_TEMP}/henan-50k-server.log" 2>&1 &)
          (python3 -m http.server 4173 --bind 127.0.0.1 --directory "${preview_root}" > "${RUNNER_TEMP}/henan-50k-preview.log" 2>&1 &)
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3002/healthz >/dev/null \
              && curl --fail --silent http://127.0.0.1:4173/pan/50k/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:4173/pan/50k/assets/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/henan-50k-server.log" || true
          cat "${RUNNER_TEMP}/henan-50k-preview.log" || true
          exit 1

      - name: Install Playwright Chromium
        working-directory: client
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Diagnose default single-player entry
        working-directory: client
        env:
          MOBILE_AUDIT_URL: http://127.0.0.1:4173/pan/50k
          DIAGNOSTIC_CASE: full-default
        run: node solo-entry-diagnostic.mjs

      - name: Capture exact mobile layout metrics
        working-directory: client
        env:
          MOBILE_AUDIT_URL: http://127.0.0.1:4173/pan/50k
        run: node mobile-layout-metrics.mjs

      - name: Audit local release on four phone sizes
        working-directory: client
        env:
          MOBILE_AUDIT_URL: http://127.0.0.1:4173/pan/50k
          EXPECTED_UI_RELEASE: ink-06-mobile-r4
          RELEASE_TIMEOUT_MS: 120000
        run: node mobile-live-audit.mjs

      - name: Upload deployable Pages build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pan-50k-pages-dist-${{ github.run_attempt }}
          path: client/dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload phone screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-live-audit-${{ github.run_attempt }}
          path: client/mobile-audit-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Print local service logs on failure
        if: failure()
        shell: bash
        run: |
          echo "Backend log:"
          cat "${RUNNER_TEMP}/henan-50k-server.log" || true
          echo "Preview log:"
          cat "${RUNNER_TEMP}/henan-50k-preview.log" || true
