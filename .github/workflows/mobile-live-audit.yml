name: Public landscape R2 audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/mobile-live-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-landscape-r2-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Public forced/native landscape and WebSocket
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout validation code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client tests and Playwright
        working-directory: client
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm test
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.54.1
          npx playwright install --with-deps chromium webkit

      - name: Wait for landscape R2 Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          origin="https://panxiangbin.github.io"
          page="${origin}/pan/50k/"
          for attempt in $(seq 1 120); do
            html="$(curl --fail --silent --show-error --location "${page}?deploy-wait=${attempt}-$(date +%s)" || true)"
            asset="$(printf '%s' "$html" | grep -oE 'src="/pan/50k/assets/[^"]+\.js"' | head -n 1 | cut -d'"' -f2 || true)"
            if [ -n "$asset" ]; then
              js="$(curl --fail --silent --show-error --location "${origin}${asset}?deploy-wait=${attempt}-$(date +%s)" || true)"
              if printf '%s' "$js" | grep -q 'landscape-r2' \
                && printf '%s' "$js" | grep -q '直接进入横屏' \
                && printf '%s' "$js" | grep -q 'force-landscape-active'; then
                echo "Public landscape R2 release is available: ${asset}"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Timed out waiting for public landscape R2 deployment"
          exit 1

      - name: Audit public forced fallback and native rotation in Chromium and WebKit
        working-directory: client
        env:
          LANDSCAPE_AUDIT_URL: https://panxiangbin.github.io/pan/50k
          EXPECTED_UI_RELEASE: ink-06-mobile-r4
        run: node landscape-live-audit.mjs

      - name: Verify real Render WebSocket stability in landscape
        working-directory: client
        env:
          PUBLIC_GAME_URL: https://panxiangbin.github.io/pan/50k
          WEBSOCKET_STABLE_WINDOW_MS: 8000
        run: node public-landscape-r2-stability.mjs

      - name: Upload public R2 audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-landscape-r2-audit-${{ github.run_attempt }}
          path: |
            client/landscape-audit-artifacts
            client/public-landscape-r2-stability-artifacts
          if-no-files-found: warn
          retention-days: 14