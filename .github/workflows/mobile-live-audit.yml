name: Public Pages mobile audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/mobile-live-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-pages-mobile-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Public Pages four-phone operability
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout verified audit code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install browser audit dependency
        working-directory: client
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.54.1

      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Audit public Pages release on four phone sizes
        working-directory: client
        env:
          MOBILE_AUDIT_URL: https://panxiangbin.github.io/pan/50k
          EXPECTED_UI_RELEASE: ink-06-mobile-r4
          RELEASE_TIMEOUT_MS: 720000
        run: node mobile-live-audit.mjs

      - name: Upload public phone screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-pages-mobile-audit-${{ github.run_attempt }}
          path: client/mobile-audit-artifacts
          if-no-files-found: warn
          retention-days: 14
