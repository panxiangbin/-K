name: Public landscape audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/mobile-live-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-landscape-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Public portrait gate, landscape table and WebSocket
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout verified audit code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client and browser audit dependency
        working-directory: client
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.54.1

      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Audit public portrait gate and landscape tables
        working-directory: client
        env:
          LANDSCAPE_AUDIT_URL: https://panxiangbin.github.io/pan/50k
          EXPECTED_UI_RELEASE: ink-06-mobile-r4
        run: node landscape-live-audit.mjs

      - name: Verify public landscape WebSocket stability
        working-directory: client
        env:
          PUBLIC_LANDSCAPE_URL: https://panxiangbin.github.io/pan/50k
          EXPECTED_UI_RELEASE: ink-06-mobile-r4
          WEBSOCKET_STABLE_WINDOW_MS: 8000
        run: node public-landscape-stability.mjs

      - name: Upload public landscape screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-landscape-audit-${{ github.run_attempt }}
          path: |
            client/landscape-audit-artifacts
            client/public-landscape-stability-artifacts
          if-no-files-found: warn
          retention-days: 14
