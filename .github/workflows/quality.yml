name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci --include=dev --no-audit --no-fund

      - name: Test client
        working-directory: client
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../client-test-output.log

      - name: Upload client test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-diagnostics-${{ github.run_attempt }}
          path: client-test-output.log
          if-no-files-found: warn
          retention-days: 7

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Install server dependencies
        working-directory: server
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Test server
        working-directory: server
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../server-test-output.log

      - name: Upload server test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-diagnostics-${{ github.run_attempt }}
          path: server-test-output.log
          if-no-files-found: warn
          retention-days: 7
